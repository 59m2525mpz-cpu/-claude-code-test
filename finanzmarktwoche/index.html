<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Finanzmarktwoche</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marktwoche">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/sofia-sans-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Etikett"; src: url("fonts/sofia-sans-condensed-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Etikett"; src: url("fonts/sofia-sans-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }

:root {
  --ground: #e4e8ed;
  --fach: #f6f7f9;
  --board: #c3cbd5;
  --rule: #dde2e8;
  --ink: #18202d;
  --muted: #566173;
  --binder: #1f3a5f;
  --binder-deep: #172d4b;
  --on-binder: #ffffff;
  --on-binder-muted: #bccadc;
  --label: #ffffff;
  --label-edge: #c9d0d9;
  --label-ink: #121822;
  --signal: #f2c230;
  --signal-edge: #d4a514;
  --focus: #2f6fd8;
  --danger: #b4232c;
  --press: rgba(31, 58, 95, .07);
  --caret: #1f3a5f;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --etikett: "Etikett", "Arial Narrow", "Roboto Condensed", var(--ui);
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #111824; --fach: #19222f; --board: #2c3748; --rule: #263142;
    --ink: #e3e8ef; --muted: #9aa6b8;
    --binder: #1d3352; --binder-deep: #162740; --on-binder-muted: #a9b9cf;
    --label: #d9dfe7; --label-edge: #aab4c2; --label-ink: #111824;
    --signal: #ddb02a; --signal-edge: #b98f12;
    --focus: #7aa7f0; --danger: #ff8d86; --press: rgba(255, 255, 255, .05); --caret: #7aa7f0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--ink); font: 16px/1.45 var(--ui);
  overscroll-behavior: none; touch-action: manipulation;
}
/* Statusleiste: das Band unter der Uhrzeit bleibt immer ordnerblau */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--binder); z-index: 10; }
::selection { background: var(--signal); color: var(--label-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 640px; margin: 0 auto; }
#sperre, #liste { touch-action: pan-y; }

/* Rückenschild: Etikett mit KW und Nummer */
.etikett {
  display: grid; justify-items: center; align-content: center; gap: 1px;
  width: 54px; height: 62px; border-radius: 7px; flex: none;
  background: var(--label); color: var(--label-ink); border: 1px solid var(--label-edge);
  font-family: var(--etikett); font-variant-numeric: tabular-nums; line-height: 1;
}
.etikett small { font-size: 12px; font-weight: 700; letter-spacing: .08em; opacity: .7; }
.etikett b { font-size: 31px; font-weight: 800; letter-spacing: -.01em; }
.etikett.signal { background: var(--signal); border-color: var(--signal-edge); }
.etikett.signal small { opacity: .8; }

/* Kopfband */
.band { background: var(--binder); color: var(--on-binder); }
.band h1 { font: 800 32px/1 var(--etikett); letter-spacing: .005em; margin: 0; text-wrap: balance; }
.band .bestand { color: var(--on-binder-muted); font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }

/* Sperre */
#sperre { min-height: 100%; display: flex; flex-direction: column; }
#sperre .band { padding-top: calc(env(safe-area-inset-top, 0px) + 56px); padding-bottom: 32px; }
#sperre .band .col { display: flex; align-items: flex-end; gap: 16px; }
#sperre .band .etikett { width: 64px; height: 74px; }
#sperre .band .etikett b { font-size: 37px; }
.sperre-form { padding-top: 28px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
.sperre-form .col { display: flex; flex-direction: column; gap: 14px; }
.sperre-form p { margin: 0; color: var(--muted); font-size: 15px; max-width: 34ch; }
.feld {
  font: inherit; font-size: 17px; width: 100%; padding: 13px 14px; border-radius: 10px;
  border: 1px solid var(--board); background: var(--fach); color: var(--ink); caret-color: var(--caret);
}
.feld::placeholder { color: var(--muted); }
.merken { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--ink); }
.merken input { width: 20px; height: 20px; accent-color: var(--binder); margin: 0; }
.primaer {
  border: 0; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: 600;
  background: var(--binder); color: var(--on-binder);
  transition: transform 160ms var(--ease), background-color 160ms ease;
}
.primaer:active { transform: scale(.98); background: var(--binder-deep); }
.primaer:disabled { opacity: .65; }
.sperre-form .fehler { color: var(--danger); font-size: 15px; min-height: 1.4em; margin: 0; }

/* Archiv */
#liste .band { padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: 18px; }
#liste .band .col { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.symbol-knopf {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px;
  background: rgba(255, 255, 255, .1); border: 0; color: var(--on-binder);
  transition: background-color 160ms ease;
}
.symbol-knopf:active { background: rgba(255, 255, 255, .2); }
.suche { position: relative; margin: 16px auto 4px; }
.suche .icon { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--muted); width: 18px; height: 18px; pointer-events: none; }
.suche input { padding-left: 38px; }
.suche input::-webkit-search-cancel-button { cursor: pointer; }
#regal > .fach { margin-top: 22px; border-radius: 6px; }
#regal { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
.boden { margin-top: 22px; }
.boden h2 {
  font: 700 15px/1 var(--etikett); letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin: 0 4px 8px;
}
/* Regalfach, darunter ein gerades Brett, etwas breiter als das Fach */
.fach { background: var(--fach); border-radius: 6px 6px 0 0; overflow: hidden; }
.boden::after {
  content: ""; display: block; height: 6px; margin: 0 -6px; border-radius: 1px;
  background: var(--board); box-shadow: 0 8px 12px -6px rgba(18, 28, 45, .35);
}
.zeile {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 12px 12px 12px 12px; border: 0; background: transparent;
  transition: background-color 120ms ease;
}
.zeile + .zeile { border-top: 1px solid var(--rule); }
.zeile:active { background: var(--press); }
.zeile .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.zeile .zeit { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.zeile .titel { font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--ink); text-wrap: balance; }
.zeile .kern { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.zeile > .icon { color: var(--muted); width: 18px; height: 18px; }
.leer { padding: 22px 18px; color: var(--muted); font-size: 15px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.leer button { border: 1px solid var(--board); background: transparent; border-radius: 9px; padding: 8px 14px; font-size: 15px; font-weight: 600; color: var(--ink); }

/* Bericht */
#leser { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; z-index: 20; }
.leiste {
  background: var(--binder); color: var(--on-binder);
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
}
.leiste button { border: 0; background: transparent; color: var(--on-binder); border-radius: 9px; transition: background-color 120ms ease; }
.leiste button:active { background: rgba(255, 255, 255, .14); }
.leiste button:disabled { opacity: .35; }
.zurueck { justify-self: start; display: inline-flex; align-items: center; gap: 2px; padding: 9px 10px 9px 4px; font-size: 16px; font-weight: 600; }
.wo { display: flex; align-items: center; gap: 8px; }
.wo .etikett { width: auto; height: 30px; padding: 0 8px; grid-auto-flow: column; gap: 5px; border-radius: 6px; align-items: center; }
.wo .etikett small { font-size: 11px; }
.wo .etikett b { font-size: 21px; }
.wo span { color: var(--on-binder-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.blaettern { justify-self: end; display: flex; }
.blaettern button { display: inline-grid; place-items: center; width: 40px; height: 40px; }
.modi {
  background: var(--binder); display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
}
.seg { display: inline-flex; background: rgba(255, 255, 255, .12); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--on-binder); font-size: 14px; font-weight: 600; padding: 6px 18px; border-radius: 7px; transition: background-color 160ms ease, color 160ms ease; }
.seg button[aria-pressed="true"] { background: var(--label); color: var(--label-ink); }
.teilen { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, .3); background: transparent; color: var(--on-binder); font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 9px; }
.teilen .icon { width: 17px; height: 17px; }
#rahmen { flex: 1; width: 100%; border: 0; background: #fff; }
#pdfView { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--ground); padding: 10px 8px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
#pdfView canvas { display: block; width: 100%; max-width: 900px; height: auto; background: #fff; box-shadow: 0 1px 3px rgba(18, 28, 45, .18); border-radius: 2px; }
#pdfView .msg { color: var(--muted); margin-top: 40px; text-align: center; font-size: 15px; padding: 0 16px; }

/* Signatur: das Etikett wandert beim Öffnen in die Leseleiste */
.wo .etikett { view-transition-name: etikett; }
::view-transition-group(etikett) { animation-duration: 240ms; animation-timing-function: var(--ease); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 180ms; }
@media (prefers-reduced-motion: reduce) {
  .primaer, .zeile, .seg button { transition: none; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-rechts" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-links" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-hoch" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-runter" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-schloss" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-suche" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-teilen" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></symbol>
</svg>

<section id="sperre" hidden>
  <div class="band gutter">
    <div class="col">
      <div class="etikett" aria-hidden="true"><small>KW</small><b id="heuteKw"></b></div>
      <div>
        <h1>Finanzmarktwoche</h1>
        <div class="bestand">Archiv gesperrt</div>
      </div>
    </div>
  </div>
  <div class="sperre-form gutter">
    <form class="col" id="lockForm" autocomplete="on">
      <p>Die Berichte sind verschlüsselt. Mit deinem Passwort öffnest du das Archiv.</p>
      <input type="text" name="username" value="finanzmarktwoche" autocomplete="username" hidden>
      <input class="feld" type="password" id="pw" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort" required>
      <label class="merken"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
      <button class="primaer" id="unlockBtn" type="submit">Archiv öffnen</button>
      <p class="fehler" id="lockErr" role="alert"></p>
    </form>
  </div>
</section>

<section id="liste" hidden>
  <header class="band gutter">
    <div class="col">
      <div>
        <h1>Finanzmarktwoche</h1>
        <div class="bestand" id="stats"></div>
      </div>
      <button class="symbol-knopf" id="sperrenBtn" type="button" aria-label="Archiv sperren"><svg class="icon"><use href="#i-schloss"/></svg></button>
    </div>
  </header>
  <div class="gutter">
    <div class="col suche">
      <svg class="icon"><use href="#i-suche"/></svg>
      <input class="feld" id="q" type="search" placeholder="Suchen: Fed, Öl, SAP, KW 41" aria-label="Berichte durchsuchen" enterkeyhint="search">
    </div>
    <main class="col" id="regal"></main>
  </div>
</section>

<section id="leser" hidden>
  <div class="leiste">
    <button class="zurueck" id="zurueck" type="button"><svg class="icon"><use href="#i-links"/></svg>Archiv</button>
    <div class="wo" id="wo"><div class="etikett"><small>KW</small><b id="woKw"></b></div><span id="woJahr"></span></div>
    <div class="blaettern">
      <button id="neuer" type="button" aria-label="Neuere Woche"><svg class="icon"><use href="#i-hoch"/></svg></button>
      <button id="aelter" type="button" aria-label="Ältere Woche"><svg class="icon"><use href="#i-runter"/></svg></button>
    </div>
  </div>
  <div class="modi" id="modes" hidden>
    <div class="seg" role="group" aria-label="Ansicht">
      <button type="button" id="modusSeite" aria-pressed="true">Seite</button>
      <button type="button" id="modusPdf" aria-pressed="false">PDF</button>
    </div>
    <button class="teilen" type="button" id="teilen" hidden><svg class="icon"><use href="#i-teilen"/></svg>Teilen</button>
  </div>
  <iframe id="rahmen" title="Wochenbericht" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
  <div id="pdfView" hidden></div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MON = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];
  const MONAT = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const SPEICHER = "fmw-schluessel";
  let index = null, key = null, berichte = [], aktuell = null, blobUrl = null;

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const lies = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const schreib = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
  let modus = lies("fmw-modus") === "pdf" ? "pdf" : "seite", pdfDatei = null, pdfLauf = 0;

  async function holeJson(pfad) {
    const r = await fetch(pfad, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function entschluesseln(box) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function ableiten(passwort) {
    const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: index.kdf.hash, salt: unb64(index.kdf.salt), iterations: index.kdf.iterations },
      basis, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function pruefen(k) {
    key = k;
    try { return (await entschluesseln(index.pruefung)) === "ok"; } catch { key = null; return false; }
  }

  // Wochen-Helfer
  function montag(jahr, kw) {
    const j4 = new Date(Date.UTC(jahr, 0, 4));
    const m = new Date(j4); m.setUTCDate(j4.getUTCDate() - ((j4.getUTCDay() || 7) - 1) + (kw - 1) * 7);
    return m;
  }
  function zeitraum(b) {
    if (b.zeitraum) return b.zeitraum;
    const m = montag(b.jahr, b.kw), f = new Date(m); f.setUTCDate(m.getUTCDate() + 4);
    return m.getUTCDate() + "." + (m.getUTCMonth() !== f.getUTCMonth() ? " " + MON[m.getUTCMonth()] : "") + " – " + f.getUTCDate() + ". " + MON[f.getUTCMonth()] + " " + f.getUTCFullYear();
  }

  function isoWoche(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }
  $("heuteKw").textContent = String(isoWoche(new Date())).padStart(2, "0");
  // Monat eines Berichts = Monat des Freitags seiner Woche
  function monat(b) {
    const f = montag(b.jahr, b.kw); f.setUTCDate(f.getUTCDate() + 4);
    return { key: f.getUTCFullYear() * 100 + f.getUTCMonth(), name: MONAT[f.getUTCMonth()] + " " + f.getUTCFullYear() };
  }
  const svg = (id) => '<svg class="icon" aria-hidden="true"><use href="#' + id + '"/></svg>';

  // Start
  async function start() {
    try { index = await holeJson("daten/index.json"); }
    catch { zeige("sperre"); $("lockErr").textContent = "Archiv nicht erreichbar. Prüfe die Internetverbindung."; return; }
    const gemerkt = lies(SPEICHER);
    if (gemerkt) {
      try {
        const s = JSON.parse(gemerkt);
        if (s.salt === index.kdf.salt) {
          const k = await crypto.subtle.importKey("raw", unb64(s.raw), "AES-GCM", false, ["decrypt"]);
          if (await pruefen(k)) return oeffnen();
        }
      } catch {}
      schreib(SPEICHER, null);
    }
    zeige("sperre");
    $("pw").focus();
  }

  $("lockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!index) return start();
    const btn = $("unlockBtn"); btn.disabled = true; btn.textContent = "Wird geöffnet …"; $("lockErr").textContent = "";
    try {
      const k = await ableiten($("pw").value);
      if (!(await pruefen(k))) { $("lockErr").textContent = "Falsches Passwort."; return; }
      if ($("merken").checked) schreib(SPEICHER, JSON.stringify({ salt: index.kdf.salt, raw: b64(await crypto.subtle.exportKey("raw", k)) }));
      $("pw").value = "";
      oeffnen();
    } catch { $("lockErr").textContent = "Entsperren fehlgeschlagen."; }
    finally { btn.disabled = false; btn.textContent = "Archiv öffnen"; }
  });

  $("sperrenBtn").addEventListener("click", () => {
    schreib(SPEICHER, null); key = null; berichte = [];
    $("regal").replaceChildren(); zeige("sperre");
  });

  function zeige(id) {
    for (const s of ["sperre", "liste"]) $(s).hidden = s !== id;
  }

  async function oeffnen() {
    berichte = [];
    for (const e of index.berichte) {
      try { berichte.push({ id: e.id, ...(await entschluesseln(e)) }); } catch {}
    }
    berichte.sort((a, b) => (b.jahr * 100 + b.kw) - (a.jahr * 100 + a.kw));
    zeige("liste");
    liste();
    const h = location.hash.match(/^#(\d{4}-kw\d{2})$/);
    if (h && berichte.some((b) => b.id === h[1])) lesen(h[1], false);
  }

  function passt(b, q) {
    if (!q) return true;
    const k = q.match(/^kw\s*(\d{1,2})$/i);
    if (k) return b.kw === Number(k[1]);
    const t = [b.titel, b.kurz, b.zeitraum, "kw " + b.kw, b.jahr, b._text || ""].join(" ").toLowerCase();
    return q.toLowerCase().split(/\s+/).every((w) => t.includes(w));
  }

  function leer(text, knopf) {
    const e = document.createElement("div"); e.className = "fach";
    const l = document.createElement("div"); l.className = "leer";
    const p = document.createElement("span"); p.textContent = text; l.appendChild(p);
    if (knopf) {
      const k = document.createElement("button"); k.type = "button"; k.textContent = "Suche löschen";
      k.addEventListener("click", () => { $("q").value = ""; liste(); $("q").focus(); });
      l.appendChild(k);
    }
    e.appendChild(l); return e;
  }

  function liste() {
    const q = $("q").value.trim();
    const box = $("regal");
    box.replaceChildren();
    const n = berichte.length;
    $("stats").textContent = n ? n + (n === 1 ? " Bericht" : " Berichte") + " · zuletzt KW " + berichte[0].kw + "/" + berichte[0].jahr : "Noch leer";
    if (!n) { box.appendChild(leer("Noch keine Wochen im Regal. Neue Berichte kommen freitags am Abend automatisch dazu.")); return; }
    const treffer = berichte.filter((b) => passt(b, q));
    if (!treffer.length) { box.appendChild(leer("Keine Woche passt zu „" + q + "“.", true)); return; }
    let mk = null, fach = null;
    for (const b of treffer) {
      const m = monat(b);
      if (m.key !== mk) {
        mk = m.key;
        const boden = document.createElement("section"); boden.className = "boden";
        const h = document.createElement("h2"); h.textContent = m.name;
        fach = document.createElement("div"); fach.className = "fach";
        boden.append(h, fach); box.appendChild(boden);
      }
      const neu = b.id === berichte[0].id;
      const el = document.createElement("button");
      el.type = "button"; el.className = "zeile" + (neu ? " neu" : ""); el.dataset.id = b.id;
      el.innerHTML = '<div class="etikett' + (neu ? " signal" : "") + '"><small>KW</small><b></b></div><div class="txt"><span class="zeit"></span><span class="titel"></span><span class="kern"></span></div>' + svg("i-rechts");
      el.querySelector(".etikett b").textContent = String(b.kw).padStart(2, "0");
      el.querySelector(".zeit").textContent = zeitraum(b);
      el.querySelector(".titel").textContent = b.titel;
      el.querySelector(".kern").textContent = b.kurz || "";
      el.setAttribute("aria-label", "KW " + b.kw + " " + b.jahr + (neu ? ", neueste Woche" : "") + ": " + b.titel);
      el.addEventListener("click", () => mitUebergang(el.querySelector(".etikett"), () => lesen(b.id, true)));
      fach.appendChild(el);
    }
  }

  // Signatur: Etikett wandert per View Transition in die Leseleiste (ohne Unterstützung: sofort)
  function mitUebergang(etikett, aktion) {
    const ruhig = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!document.startViewTransition || ruhig || !etikett) { aktion(); return; }
    etikett.style.viewTransitionName = "etikett";
    const t = document.startViewTransition(() => { etikett.style.viewTransitionName = ""; aktion(); });
    t.finished.finally(() => { etikett.style.viewTransitionName = ""; });
  }
  function schliessenMitUebergang() {
    const ruhig = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const id = aktuell !== null ? berichte[aktuell].id : null;
    const ziel = id && document.querySelector('.zeile[data-id="' + id + '"] .etikett');
    if (!document.startViewTransition || ruhig || !ziel) { schliessen(); return; }
    const t = document.startViewTransition(() => { schliessen(); ziel.style.viewTransitionName = "etikett"; });
    t.finished.finally(() => { ziel.style.viewTransitionName = ""; });
  }
  $("q").addEventListener("input", liste);

  // Bericht anzeigen
  let markedLaden = null;
  function ladeMarked() {
    if (window.marked) return Promise.resolve();
    if (!markedLaden) markedLaden = new Promise((ok, nein) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js";
      s.onload = ok; s.onerror = () => { markedLaden = null; nein(); };
      document.head.appendChild(s);
    });
    return markedLaden;
  }
  const MD_STIL = "<style>body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#16223a;background:#fff}main{max-width:720px;margin:0 auto;padding:20px 16px 48px}h1,h2,h3{color:#0e2a66;line-height:1.25;text-wrap:balance}h1{font-size:24px}h2{font-size:19px;margin-top:1.6em;padding-bottom:6px;border-bottom:1px solid #e2e6ed}h3{font-size:16px}a{color:#1f5ae0}table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e2e6ed;vertical-align:top}th{color:#5d6880;font-weight:500;font-size:12.5px}.tbl{overflow-x:auto}blockquote{margin:1em 0;padding:4px 14px;border-left:3px solid #cddcfb;color:#3f4c66}code{background:#f4f6fa;padding:1px 5px;border-radius:4px}</style>";

  function dokument(b, inhalt) {
    const kopf = '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">';
    if (b.format === "md") {
      let html;
      if (window.marked) {
        html = marked.parse(inhalt, { gfm: true }).replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
      } else {
        html = "<pre style=\"white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace\">" + inhalt.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</pre>";
      }
      return kopf + MD_STIL + "</head><body><main>" + html + "</main></body></html>";
    }
    return kopf + "</head><body>" + inhalt + "</body></html>";
  }

  // PDF-Ansicht (pdf.js liegt in vendor/, funktioniert offline)
  function ladePdfJs() {
    if (window.pdfjsLib) return Promise.resolve();
    return new Promise((ok, nein) => {
      const s = document.createElement("script");
      s.src = "vendor/pdf.min.js";
      s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js"; ok(); };
      s.onerror = nein;
      document.head.appendChild(s);
    });
  }
  async function holePdf(b) {
    if (b._pdf) return b._pdf;
    const box = await holeJson("daten/" + b.id + ".pdf.json");
    const bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct)));
    b._pdf = new File([bytes], b.pdf, { type: "application/pdf" });
    return b._pdf;
  }
  function pdfMeldung(text) {
    const v = $("pdfView"); v.replaceChildren();
    const m = document.createElement("p"); m.className = "msg"; m.textContent = text; v.appendChild(m);
  }
  async function zeigePdf(b) {
    const lauf = ++pdfLauf, v = $("pdfView");
    pdfMeldung("PDF wird geladen …");
    try {
      const [datei] = await Promise.all([holePdf(b), ladePdfJs()]);
      if (lauf !== pdfLauf) return;
      pdfDatei = datei;
      $("teilen").hidden = !(navigator.canShare && navigator.canShare({ files: [datei] }));
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await datei.arrayBuffer()) }).promise;
      if (lauf !== pdfLauf) return;
      v.replaceChildren();
      const breite = Math.min(v.clientWidth - 16, 900);
      const dichte = Math.min((window.devicePixelRatio || 1) * 1.5, 3.5);
      for (let n = 1; n <= doc.numPages; n++) {
        const seite = await doc.getPage(n);
        if (lauf !== pdfLauf) return;
        const vp = seite.getViewport({ scale: (breite / seite.getViewport({ scale: 1 }).width) * dichte });
        const c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.setAttribute("aria-label", "Seite " + n + " von " + doc.numPages);
        v.appendChild(c);
        await seite.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch {
      if (lauf === pdfLauf) pdfMeldung("PDF konnte nicht geladen werden. Prüfe die Internetverbindung.");
    }
  }
  function setzeModus(m) {
    modus = m; schreib("fmw-modus", m);
    $("modusSeite").setAttribute("aria-pressed", m === "seite");
    $("modusPdf").setAttribute("aria-pressed", m === "pdf");
    if (aktuell !== null) anzeigen(berichte[aktuell]);
  }
  function anzeigen(b) {
    const pdf = modus === "pdf" && !!b.pdf;
    $("modes").hidden = !b.pdf;
    $("rahmen").hidden = pdf;
    $("pdfView").hidden = !pdf;
    if (!pdf) { $("teilen").hidden = true; pdfLauf++; return; }
    $("pdfView").scrollTop = 0;
    zeigePdf(b);
  }
  $("modusSeite").addEventListener("click", () => setzeModus("seite"));
  $("modusPdf").addEventListener("click", () => setzeModus("pdf"));
  $("teilen").addEventListener("click", async () => {
    if (!pdfDatei) return;
    try { await navigator.share({ files: [pdfDatei], title: pdfDatei.name }); } catch {}
  });

  async function lesen(id, push) {
    const i = berichte.findIndex((b) => b.id === id);
    if (i < 0) return;
    aktuell = i;
    const b = berichte[i];
    $("woKw").textContent = String(b.kw).padStart(2, "0");
    $("woJahr").textContent = b.jahr;
    $("wo").querySelector(".etikett").classList.toggle("signal", i === 0);
    $("neuer").disabled = i === 0;
    $("aelter").disabled = i === berichte.length - 1;
    $("leser").hidden = false;
    $("modusSeite").setAttribute("aria-pressed", modus === "seite");
    $("modusPdf").setAttribute("aria-pressed", modus === "pdf");
    zoomErlauben(true);
    anzeigen(b);
    // Ohne Verlaufseinträge: Zurück schließt den Bericht direkt (iframe-Ladevorgänge landen sonst im Verlauf)
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    zeigeImRahmen(null);
    try {
      const box = await holeJson("daten/" + id + ".json");
      const { inhalt } = await entschluesseln(box);
      if (b.format === "md") { try { await ladeMarked(); } catch {} }
      if (aktuell !== i) return;
      // Externe Links öffnen außerhalb der App
      let html = dokument(b, inhalt).replace(/<a\s+href="(https?:)/gi, '<a target="_blank" rel="noopener" href="$1');
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      zeigeImRahmen(blobUrl);
      b._text = inhalt.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 20000);
    } catch {
      if (aktuell !== i) return;
      const fehler = '<!doctype html><meta charset="utf-8"><body style="font:16px -apple-system,sans-serif;color:#5d6880;padding:40px 20px;text-align:center">Bericht konnte nicht geladen werden. Prüfe die Internetverbindung.</body>';
      zeigeImRahmen(URL.createObjectURL(new Blob([fehler], { type: "text/html" })));
    }
  }

  // Zoom nur im Bericht. Beim Schließen setzt maximum-scale=1 eine Vergrößerung zurück.
  function zoomErlauben(ja) {
    $("vp").setAttribute("content", "width=device-width,initial-scale=1" + (ja ? "" : ",maximum-scale=1,user-scalable=no") + ",viewport-fit=cover");
  }
  ["gesturestart", "gesturechange"].forEach((t) => document.addEventListener(t, (e) => {
    if ($("leser").hidden) e.preventDefault();
  }, { passive: false }));

  // Jeder Bericht bekommt einen frischen Rahmen, damit kein Ladevorgang im Verlauf landet
  function zeigeImRahmen(url) {
    const alt = $("rahmen"), neu = alt.cloneNode(false);
    neu.removeAttribute("src");
    if (url) neu.src = url;
    alt.replaceWith(neu);
  }
  function schliessen() {
    zoomErlauben(false);
    $("leser").hidden = true; aktuell = null; pdfLauf++;
    $("pdfView").replaceChildren(); pdfDatei = null;
    zeigeImRahmen(null);
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  }
  $("zurueck").addEventListener("click", schliessenMitUebergang);
  $("neuer").addEventListener("click", () => { if (aktuell > 0) lesen(berichte[aktuell - 1].id, false); });
  $("aelter").addEventListener("click", () => { if (aktuell < berichte.length - 1) lesen(berichte[aktuell + 1].id, false); });

  // Beim Zurückkehren in die App neue Berichte holen
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || !key) return;
    try {
      const neu = await holeJson("daten/index.json");
      if (neu.kdf.salt !== index.kdf.salt) { schreib(SPEICHER, null); location.reload(); return; }
      if (JSON.stringify(neu.berichte.map((x) => x.id + x.hash)) !== JSON.stringify(index.berichte.map((x) => x.id + x.hash))) {
        index = neu;
        const offen = aktuell !== null ? berichte[aktuell].id : null;
        await oeffnen();
        if (offen) lesen(offen, false);
      }
    } catch {}
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {}); });
  }
  start();
})();
</script>
