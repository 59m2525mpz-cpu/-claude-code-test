<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzmarktwoche</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marktwoche">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0e2a66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: eine Lesespalte. Sperrbildschirm → Liste der Kalenderwochen (neueste oben) → Bericht im Vollbild */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --ink: #16223a;
  --muted: #5d6880;
  --line: #e2e6ed;
  --head: #0e2a66;
  --blue: #1f5ae0;
  --blue-soft: #eaf0fd;
  --neg: #c4242a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c1220; --surface: #151d2e; --ink: #e6ebf5; --muted: #95a0b8; --line: #263049;
    --head: #c9d6f7; --blue: #8fb0ff; --blue-soft: #1c2a4f; --neg: #ff8a85; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); overscroll-behavior: none; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }

.screen {
  min-height: 100%;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px));
}
.col { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Sperre */
#sperre .col { min-height: calc(100vh - 120px); justify-content: center; gap: 22px; }
.mark { width: 64px; height: 64px; border-radius: 15px; display: block; }
.kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); font-weight: 700; }
h1 { font: 800 32px/1.05 var(--font-num); letter-spacing: -.02em; color: var(--head); margin: 4px 0 0; }
.lead { color: var(--muted); margin: 0; }
form.lock { display: flex; flex-direction: column; gap: 12px; }
form.lock input[type=password] {
  font: inherit; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%;
}
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.primary { background: var(--blue); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 17px; }
@media (prefers-color-scheme: dark) { .primary { color: #0c1220; } }
.primary:disabled { opacity: .6; }
.err { color: var(--neg); font-size: 14px; min-height: 1.4em; margin: 0; }

/* Liste */
header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
header.top > div { min-width: 0; }
#liste h1 { font-size: clamp(24px, 7.4vw, 32px); }
.icon-btn { background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.meta-line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.year { display: flex; flex-direction: column; gap: 10px; }
.year-label { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 10px; }
.year-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.item {
  display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--ink);
}
.item:active { transform: scale(.99); }
.item.latest { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
.kw { display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--line); padding-right: 12px; }
.kw small { font-size: 10px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.kw b { font: 800 28px/1 var(--font-num); color: var(--blue); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.range { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ttl { font-weight: 650; font-size: 16px; line-height: 1.3; color: var(--head); }
.badge { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 1px 7px; }
.teaser { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); text-align: center; }

/* Bericht */
#leser { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; z-index: 5; }
.bar {
  display: flex; align-items: center; gap: 8px; background: var(--head); color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px));
}
@media (prefers-color-scheme: dark) { .bar { background: #0e2a66; } }
.bar button { background: transparent; border: 0; color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 16px; }
.bar button:disabled { opacity: .35; }
.bar .back { font-weight: 600; }
.bar .where { flex: 1; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rahmen { flex: 1; width: 100%; border: 0; background: #fff; }
.modes { display: flex; justify-content: center; gap: 8px; align-items: center; background: var(--head);
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) 10px max(10px, env(safe-area-inset-left, 0px)); }
@media (prefers-color-scheme: dark) { .modes { background: #0e2a66; } }
.seg { display: inline-flex; background: rgba(255,255,255,.14); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; color: #fff; font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 7px; }
.seg button[aria-pressed="true"] { background: #fff; color: #0e2a66; }
.share { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 9px; }
#pdfView { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #dfe4ec; padding: 10px 8px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
#pdfView canvas { display: block; width: 100%; max-width: 900px; height: auto; background: #fff; box-shadow: 0 1px 3px rgba(14,42,102,.18); border-radius: 2px; }
#pdfView .msg { color: #5d6880; margin-top: 40px; text-align: center; font-size: 15px; padding: 0 16px; }
.loading { position: absolute; inset: 50% 0 auto; text-align: center; color: #5d6880; }
@media (prefers-reduced-motion: reduce) { .item:active { transform: none; } }
</style>
</head>
<body>

<section class="screen" id="sperre" hidden>
  <div class="col">
    <img class="mark" src="icons/icon-192.png" alt="">
    <div>
      <div class="kicker">Finanzmarkt-Wochenberichte</div>
      <h1>Finanzmarktwoche</h1>
    </div>
    <p class="lead">Die Berichte sind verschlüsselt. Gib dein Passwort ein, um das Archiv zu öffnen.</p>
    <form class="lock" id="lockForm" autocomplete="on">
      <input type="text" name="username" value="finanzmarktwoche" autocomplete="username" hidden>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" required>
      <label class="check"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
      <button class="primary" id="unlockBtn" type="submit">Entsperren</button>
      <p class="err" id="lockErr" role="alert"></p>
    </form>
  </div>
</section>

<section class="screen" id="liste" hidden>
  <div class="col">
    <header class="top">
      <div>
        <div class="kicker">Finanzmarkt-Wochenberichte</div>
        <h1>Finanzmarktwoche</h1>
        <div class="meta-line" id="stats"></div>
      </div>
      <button class="icon-btn" id="sperrenBtn" type="button">Sperren</button>
    </header>
    <input class="search" id="q" type="search" placeholder="Suchen: Fed, Öl, SAP, KW 41 …" aria-label="Berichte durchsuchen">
    <main id="items"></main>
    <p class="note" id="status"></p>
  </div>
</section>

<section id="leser" hidden>
  <div class="bar">
    <button class="back" id="zurueck" type="button">‹ Übersicht</button>
    <div class="where" id="wo"></div>
    <button id="neuer" type="button" aria-label="Neuere Woche">▲</button>
    <button id="aelter" type="button" aria-label="Ältere Woche">▼</button>
  </div>
  <div class="modes" id="modes" hidden>
    <div class="seg" role="group" aria-label="Ansicht">
      <button type="button" id="modusSeite" aria-pressed="true">Seite</button>
      <button type="button" id="modusPdf" aria-pressed="false">PDF</button>
    </div>
    <button class="share" type="button" id="teilen" hidden>Teilen / Sichern</button>
  </div>
  <iframe id="rahmen" title="Wochenbericht" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
  <div id="pdfView" hidden></div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MON = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];
  const SPEICHER = "fmw-schluessel";
  let index = null, key = null, berichte = [], aktuell = null, blobUrl = null;

  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const lies = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const schreib = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
  let modus = lies("fmw-modus") === "pdf" ? "pdf" : "seite", pdfDatei = null, pdfLauf = 0;

  async function holeJson(pfad) {
    const r = await fetch(pfad, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function entschluesseln(box) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function ableiten(passwort) {
    const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: index.kdf.hash, salt: unb64(index.kdf.salt), iterations: index.kdf.iterations },
      basis, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function pruefen(k) {
    key = k;
    try { return (await entschluesseln(index.pruefung)) === "ok"; } catch { key = null; return false; }
  }

  // Wochen-Helfer
  function montag(jahr, kw) {
    const j4 = new Date(Date.UTC(jahr, 0, 4));
    const m = new Date(j4); m.setUTCDate(j4.getUTCDate() - ((j4.getUTCDay() || 7) - 1) + (kw - 1) * 7);
    return m;
  }
  function zeitraum(b) {
    if (b.zeitraum) return b.zeitraum;
    const m = montag(b.jahr, b.kw), f = new Date(m); f.setUTCDate(m.getUTCDate() + 4);
    return m.getUTCDate() + "." + (m.getUTCMonth() !== f.getUTCMonth() ? " " + MON[m.getUTCMonth()] : "") + " – " + f.getUTCDate() + ". " + MON[f.getUTCMonth()] + " " + f.getUTCFullYear();
  }

  // Start
  async function start() {
    try { index = await holeJson("daten/index.json"); }
    catch { zeige("sperre"); $("lockErr").textContent = "Archiv nicht erreichbar. Prüfe die Internetverbindung."; return; }
    const gemerkt = lies(SPEICHER);
    if (gemerkt) {
      try {
        const s = JSON.parse(gemerkt);
        if (s.salt === index.kdf.salt) {
          const k = await crypto.subtle.importKey("raw", unb64(s.raw), "AES-GCM", false, ["decrypt"]);
          if (await pruefen(k)) return oeffnen();
        }
      } catch {}
      schreib(SPEICHER, null);
    }
    zeige("sperre");
    $("pw").focus();
  }

  $("lockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!index) return start();
    const btn = $("unlockBtn"); btn.disabled = true; btn.textContent = "Prüft …"; $("lockErr").textContent = "";
    try {
      const k = await ableiten($("pw").value);
      if (!(await pruefen(k))) { $("lockErr").textContent = "Falsches Passwort."; return; }
      if ($("merken").checked) schreib(SPEICHER, JSON.stringify({ salt: index.kdf.salt, raw: b64(await crypto.subtle.exportKey("raw", k)) }));
      $("pw").value = "";
      oeffnen();
    } catch { $("lockErr").textContent = "Entsperren fehlgeschlagen."; }
    finally { btn.disabled = false; btn.textContent = "Entsperren"; }
  });

  $("sperrenBtn").addEventListener("click", () => {
    schreib(SPEICHER, null); key = null; berichte = [];
    $("items").replaceChildren(); zeige("sperre");
  });

  function zeige(id) {
    for (const s of ["sperre", "liste"]) $(s).hidden = s !== id;
  }

  async function oeffnen() {
    berichte = [];
    for (const e of index.berichte) {
      try { berichte.push({ id: e.id, ...(await entschluesseln(e)) }); } catch {}
    }
    berichte.sort((a, b) => (b.jahr * 100 + b.kw) - (a.jahr * 100 + a.kw));
    zeige("liste");
    liste();
    const h = location.hash.match(/^#(\d{4}-kw\d{2})$/);
    if (h && berichte.some((b) => b.id === h[1])) lesen(h[1], false);
  }

  function passt(b, q) {
    if (!q) return true;
    const k = q.match(/^kw\s*(\d{1,2})$/i);
    if (k) return b.kw === Number(k[1]);
    const t = [b.titel, b.kurz, b.zeitraum, "kw " + b.kw, b.jahr, b._text || ""].join(" ").toLowerCase();
    return q.toLowerCase().split(/\s+/).every((w) => t.includes(w));
  }

  function liste() {
    const q = $("q").value.trim();
    const box = $("items");
    box.replaceChildren();
    const n = berichte.length;
    $("stats").textContent = n ? n + (n === 1 ? " Bericht" : " Berichte") + " · zuletzt KW " + berichte[0].kw + "/" + berichte[0].jahr : "";
    if (!n) {
      const e = document.createElement("div"); e.className = "empty";
      e.textContent = "Noch keine Berichte im Archiv. Neue Wochenberichte erscheinen hier automatisch.";
      box.appendChild(e); return;
    }
    const treffer = berichte.filter((b) => passt(b, q));
    if (!treffer.length) {
      const e = document.createElement("div"); e.className = "empty";
      e.textContent = "Kein Bericht passt zu „" + q + "“.";
      box.appendChild(e); return;
    }
    let jahr = null, gruppe = null;
    for (const b of treffer) {
      if (b.jahr !== jahr) {
        jahr = b.jahr;
        gruppe = document.createElement("section"); gruppe.className = "year";
        const l = document.createElement("div"); l.className = "year-label"; l.textContent = jahr;
        gruppe.appendChild(l); box.appendChild(gruppe);
      }
      const neu = b.id === berichte[0].id;
      const el = document.createElement("button");
      el.type = "button"; el.className = "item" + (neu ? " latest" : "");
      el.innerHTML = '<div class="kw"><small>KW</small><b></b></div><div class="txt"><span class="range"></span><span class="ttl"></span><span class="teaser"></span></div>';
      el.querySelector(".kw b").textContent = String(b.kw).padStart(2, "0");
      el.querySelector(".range").textContent = zeitraum(b);
      const t = el.querySelector(".ttl"); t.textContent = b.titel;
      if (neu) { const s = document.createElement("span"); s.className = "badge"; s.textContent = "neu"; t.appendChild(s); }
      el.querySelector(".teaser").textContent = b.kurz || "";
      el.addEventListener("click", () => lesen(b.id, true));
      gruppe.appendChild(el);
    }
  }
  $("q").addEventListener("input", liste);

  // Bericht anzeigen
  let markedLaden = null;
  function ladeMarked() {
    if (window.marked) return Promise.resolve();
    if (!markedLaden) markedLaden = new Promise((ok, nein) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js";
      s.onload = ok; s.onerror = () => { markedLaden = null; nein(); };
      document.head.appendChild(s);
    });
    return markedLaden;
  }
  const MD_STIL = "<style>body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#16223a;background:#fff}main{max-width:720px;margin:0 auto;padding:20px 16px 48px}h1,h2,h3{color:#0e2a66;line-height:1.25;text-wrap:balance}h1{font-size:24px}h2{font-size:19px;margin-top:1.6em;padding-bottom:6px;border-bottom:1px solid #e2e6ed}h3{font-size:16px}a{color:#1f5ae0}table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e2e6ed;vertical-align:top}th{color:#5d6880;font-weight:500;font-size:12.5px}.tbl{overflow-x:auto}blockquote{margin:1em 0;padding:4px 14px;border-left:3px solid #cddcfb;color:#3f4c66}code{background:#f4f6fa;padding:1px 5px;border-radius:4px}</style>";

  function dokument(b, inhalt) {
    const kopf = '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">';
    if (b.format === "md") {
      let html;
      if (window.marked) {
        html = marked.parse(inhalt, { gfm: true }).replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
      } else {
        html = "<pre style=\"white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace\">" + inhalt.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</pre>";
      }
      return kopf + MD_STIL + "</head><body><main>" + html + "</main></body></html>";
    }
    return kopf + "</head><body>" + inhalt + "</body></html>";
  }

  // PDF-Ansicht (pdf.js liegt in vendor/, funktioniert offline)
  function ladePdfJs() {
    if (window.pdfjsLib) return Promise.resolve();
    return new Promise((ok, nein) => {
      const s = document.createElement("script");
      s.src = "vendor/pdf.min.js";
      s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js"; ok(); };
      s.onerror = nein;
      document.head.appendChild(s);
    });
  }
  async function holePdf(b) {
    if (b._pdf) return b._pdf;
    const box = await holeJson("daten/" + b.id + ".pdf.json");
    const bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct)));
    b._pdf = new File([bytes], b.pdf, { type: "application/pdf" });
    return b._pdf;
  }
  function pdfMeldung(text) {
    const v = $("pdfView"); v.replaceChildren();
    const m = document.createElement("p"); m.className = "msg"; m.textContent = text; v.appendChild(m);
  }
  async function zeigePdf(b) {
    const lauf = ++pdfLauf, v = $("pdfView");
    pdfMeldung("PDF wird geladen …");
    try {
      const [datei] = await Promise.all([holePdf(b), ladePdfJs()]);
      if (lauf !== pdfLauf) return;
      pdfDatei = datei;
      $("teilen").hidden = !(navigator.canShare && navigator.canShare({ files: [datei] }));
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await datei.arrayBuffer()) }).promise;
      if (lauf !== pdfLauf) return;
      v.replaceChildren();
      const breite = Math.min(v.clientWidth - 16, 900);
      const dichte = Math.min((window.devicePixelRatio || 1) * 1.5, 3.5);
      for (let n = 1; n <= doc.numPages; n++) {
        const seite = await doc.getPage(n);
        if (lauf !== pdfLauf) return;
        const vp = seite.getViewport({ scale: (breite / seite.getViewport({ scale: 1 }).width) * dichte });
        const c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.setAttribute("aria-label", "Seite " + n + " von " + doc.numPages);
        v.appendChild(c);
        await seite.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch {
      if (lauf === pdfLauf) pdfMeldung("PDF konnte nicht geladen werden. Prüfe die Internetverbindung.");
    }
  }
  function setzeModus(m) {
    modus = m; schreib("fmw-modus", m);
    $("modusSeite").setAttribute("aria-pressed", m === "seite");
    $("modusPdf").setAttribute("aria-pressed", m === "pdf");
    if (aktuell !== null) anzeigen(berichte[aktuell]);
  }
  function anzeigen(b) {
    const pdf = modus === "pdf" && !!b.pdf;
    $("modes").hidden = !b.pdf;
    $("rahmen").hidden = pdf;
    $("pdfView").hidden = !pdf;
    if (!pdf) { $("teilen").hidden = true; pdfLauf++; return; }
    $("pdfView").scrollTop = 0;
    zeigePdf(b);
  }
  $("modusSeite").addEventListener("click", () => setzeModus("seite"));
  $("modusPdf").addEventListener("click", () => setzeModus("pdf"));
  $("teilen").addEventListener("click", async () => {
    if (!pdfDatei) return;
    try { await navigator.share({ files: [pdfDatei], title: pdfDatei.name }); } catch {}
  });

  async function lesen(id, push) {
    const i = berichte.findIndex((b) => b.id === id);
    if (i < 0) return;
    aktuell = i;
    const b = berichte[i];
    $("wo").textContent = "KW " + b.kw + " · " + b.jahr;
    $("neuer").disabled = i === 0;
    $("aelter").disabled = i === berichte.length - 1;
    $("leser").hidden = false;
    $("modusSeite").setAttribute("aria-pressed", modus === "seite");
    $("modusPdf").setAttribute("aria-pressed", modus === "pdf");
    anzeigen(b);
    if (push) history.pushState(null, "", "#" + id); else if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    const rahmen = $("rahmen");
    rahmen.removeAttribute("src");
    try {
      const box = await holeJson("daten/" + id + ".json");
      const { inhalt } = await entschluesseln(box);
      if (b.format === "md") { try { await ladeMarked(); } catch {} }
      if (aktuell !== i) return;
      // Externe Links öffnen außerhalb der App
      let html = dokument(b, inhalt).replace(/<a\s+href="(https?:)/gi, '<a target="_blank" rel="noopener" href="$1');
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      rahmen.src = blobUrl;
      b._text = inhalt.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 20000);
    } catch {
      if (aktuell !== i) return;
      const fehler = '<!doctype html><meta charset="utf-8"><body style="font:16px -apple-system,sans-serif;color:#5d6880;padding:40px 20px;text-align:center">Bericht konnte nicht geladen werden. Prüfe die Internetverbindung.</body>';
      rahmen.src = URL.createObjectURL(new Blob([fehler], { type: "text/html" }));
    }
  }

  function schliessen() {
    $("leser").hidden = true; aktuell = null; pdfLauf++;
    $("pdfView").replaceChildren(); pdfDatei = null;
    $("rahmen").removeAttribute("src");
  }
  $("zurueck").addEventListener("click", () => { if (location.hash) history.back(); else schliessen(); });
  $("neuer").addEventListener("click", () => { if (aktuell > 0) lesen(berichte[aktuell - 1].id, false); });
  $("aelter").addEventListener("click", () => { if (aktuell < berichte.length - 1) lesen(berichte[aktuell + 1].id, false); });
  window.addEventListener("popstate", () => {
    const h = location.hash.match(/^#(\d{4}-kw\d{2})$/);
    if (h && key) lesen(h[1], false); else schliessen();
  });

  // Beim Zurückkehren in die App neue Berichte holen
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || !key) return;
    try {
      const neu = await holeJson("daten/index.json");
      if (neu.kdf.salt !== index.kdf.salt) { schreib(SPEICHER, null); location.reload(); return; }
      if (JSON.stringify(neu.berichte.map((x) => x.id + x.hash)) !== JSON.stringify(index.berichte.map((x) => x.id + x.hash))) {
        index = neu;
        const offen = aktuell !== null ? berichte[aktuell].id : null;
        await oeffnen();
        if (offen) lesen(offen, false);
      }
    } catch {}
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {}); });
  }
  start();
})();
</script>
</body>
</html>
